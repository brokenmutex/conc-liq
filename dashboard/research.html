<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><title>CONC LIQ · Research</title>
  <link rel="stylesheet" href="/research.css"><script src="/research.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a href="/" class="wordmark"><span class="brand-icon">≋</span> CONC<span class="light">LIQ</span></a>
      <nav aria-label="Sections"><a href="/">Positions</a><a href="/research" aria-current="page">Research</a></nav>
      <div class="sample-clock"><span id="status">Loading…</span><span class="muted">New York · ET</span></div>
    </header>
    <div class="page-heading">
      <div>
        <h1>RWA pool research</h1>
        <p>Recorded pool flow across the indexed universe. Modeled, not realized — nothing here authorizes execution.</p>
      </div>
      <div class="global-controls">
        <div class="segmented" id="window-select" role="group" aria-label="Trailing window"></div>
        <div class="segmented" id="width-select" role="group" aria-label="Reference half-width"></div>
      </div>
    </div>
    <main>
      <section aria-label="Pool comparison">
        <div class="section-heading">
          <h2>Pool comparison</h2>
          <span class="badge" id="window-label"></span>
          <p class="muted" id="assumptions"></p>
        </div>
        <div class="panel"><table class="league" id="league"><thead></thead><tbody></tbody></table></div>
      </section>
      <section aria-label="Selected pool" id="detail"></section>
    </main>
    <footer>CONC LIQ <span id="footnote">Research view · USDG</span><a href="/">Back to positions ↗</a></footer>
  </div>
</body>
</html>
