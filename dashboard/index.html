<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><title>CONC LIQ · Positions</title>
  <link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script>
</head>
<body>
  <div id="connection-banner" class="preview-banner" role="status">Connecting to position records…</div>
  <div class="shell">
    <header class="masthead"><a href="#" class="wordmark"><span class="brand-icon">≋</span> CONC<span class="light">LIQ</span></a><nav aria-label="Sections"><a href="#live">Live positions</a><a href="#paper">Paper positions</a><button id="diagnostics-button" class="text-button">Diagnostics</button></nav><div class="sample-clock"><span id="connection-status">Connecting…</span><span class="muted">New York · ET</span></div></header>
    <div class="page-heading"><div><h1>Positions</h1><p>Your capital, performance and next actions.</p></div><div class="global-controls"><label><span class="sr-only">Filter by asset</span><select id="asset-filter"><option value="all">All assets</option></select></label><label><span class="sr-only">Filter by status</span><select id="status-filter"><option value="all">All statuses</option><option value="attention">Needs attention</option><option value="open">In range</option><option value="waiting">Awaiting entry</option></select></label></div></div>
    <main><section id="live" class="portfolio" aria-label="Live positions"></section><section id="paper" class="portfolio" aria-label="Paper positions"></section></main>
    <footer>CONC LIQ <span>Live and paper position history · USDG</span><a href="#">Back to top ↑</a></footer>
  </div>
  <dialog id="detail-dialog"><header><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="Close details">×</button></header><div id="dialog-body"></div></dialog>
</body>
</html>
